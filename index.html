<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一间无需会员的线上电影阅览室，收录免费正版、公版与开放授权影片。">
  <meta name="theme-color" content="#111214">
  <title>旧碟馆 · 免费电影海报墙</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-film" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="2"></rect>
      <path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4M7 12h10"></path>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m20 20-4-4"></path>
    </symbol>
    <symbol id="icon-heart" viewBox="0 0 24 24">
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"></path>
    </symbol>
    <symbol id="icon-play" viewBox="0 0 24 24">
      <path d="m8 5 11 7-11 7V5Z"></path>
    </symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24">
      <path d="M5 12h14M13 6l6 6-6 6"></path>
    </symbol>
    <symbol id="icon-flip" viewBox="0 0 24 24">
      <path d="M20 7v5h-5M4 17v-5h5"></path>
      <path d="M6.1 8a7 7 0 0 1 11.5-2L20 8M4 16l2.4 2A7 7 0 0 0 17.9 16"></path>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="m6 6 12 12M18 6 6 18"></path>
    </symbol>
    <symbol id="icon-spark" viewBox="0 0 24 24">
      <path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"></path>
      <path d="m19 16 .8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"></path>
    </symbol>
  </svg>

  <div class="ambient-glow" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="./" aria-label="旧碟馆首页">
      <span class="brand-mark"><svg class="icon"><use href="#icon-film"></use></svg></span>
      <span class="brand-copy">
        <strong>旧碟馆</strong>
        <small>免费电影海报墙</small>
      </span>
    </a>
    <div class="header-note"><span class="status-dot"></span>只收录合法免费片源</div>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow"><span></span>一间不需要会员的电影阅览室</p>
        <h1 id="hero-title">把电影<br><em>放回书架。</em></h1>
        <p class="hero-description">像小时候逛租碟店一样，先看封面，再翻到背面读一段简介。挑中哪一部，就前往原站免费观看。</p>
        <div class="hero-stats" aria-label="片库概况">
          <div><strong id="total-movies">36</strong><span>部影片</span></div>
          <i></i>
          <div><strong id="total-categories">4</strong><span>类片架</span></div>
          <i></i>
          <div><strong>0</strong><span>元会员费</span></div>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="hero-poster hero-poster-back">
          <img src="assets/posters/m1905-1181199.jpg" alt="">
        </div>
        <div class="hero-poster hero-poster-middle">
          <img src="assets/posters/m1905-355722.jpg" alt="">
        </div>
        <div class="hero-poster hero-poster-front">
          <img src="assets/posters/m1905-1391225.jpg" alt="">
          <span>热门片</span>
        </div>
        <div class="hero-art-shadow"></div>
      </div>
    </section>

    <section class="browser-panel" aria-label="查找影片">
      <div class="toolbar-main">
        <label class="search-box" for="search-input">
          <svg class="icon"><use href="#icon-search"></use></svg>
          <span class="sr-only">搜索影片</span>
          <input id="search-input" type="search" placeholder="搜片名、英文名、演员、导演、类型…" autocomplete="off">
          <button id="clear-search" class="clear-search" type="button" aria-label="清空搜索" hidden>
            <svg class="icon"><use href="#icon-close"></use></svg>
          </button>
        </label>
        <nav class="filters" id="filters" aria-label="影片分类">
          <button class="filter-chip is-active" type="button" data-filter="all" aria-pressed="true">全部<span data-count="all"></span></button>
          <button class="filter-chip" type="button" data-filter="category:动作" aria-pressed="false">动作<span data-count="category:动作"></span></button>
          <button class="filter-chip" type="button" data-filter="category:喜剧" aria-pressed="false">喜剧<span data-count="category:喜剧"></span></button>
          <button class="filter-chip" type="button" data-filter="category:剧情" aria-pressed="false">剧情<span data-count="category:剧情"></span></button>
          <button class="filter-chip" type="button" data-filter="category:动画" aria-pressed="false">动画<span data-count="category:动画"></span></button>
          <button class="filter-chip" type="button" data-filter="favorites" aria-pressed="false">想看<span data-count="favorites"></span></button>
        </nav>
      </div>
      <div class="result-bar">
        <p id="result-summary" aria-live="polite"></p>
        <button id="reset-filters" class="text-button" type="button" hidden>清除筛选<svg class="icon"><use href="#icon-arrow"></use></svg></button>
      </div>
    </section>

    <section id="shelves" class="shelves" aria-label="影片书架"></section>

    <section id="empty-state" class="empty-state" hidden>
      <div class="empty-icon"><svg class="icon"><use href="#icon-film"></use></svg></div>
      <h2>这一格暂时是空的</h2>
      <p id="empty-message">换个片名或分类试试。</p>
      <button class="primary-button" id="empty-reset" type="button">看看全部影片</button>
    </section>

    <section class="source-note" aria-labelledby="source-note-title">
      <div class="source-note-icon"><svg class="icon"><use href="#icon-spark"></use></svg></div>
      <div>
        <h2 id="source-note-title">每一部，都有来处</h2>
        <p>这里不搬运破解资源，只收录免费正版、公版或开放授权影片。点击卡片背面的按钮，会前往原站观看；片源是否可用，以原站当前状态为准。</p>
      </div>
      <div class="source-links">
        <a href="https://www.1905.com/" target="_blank" rel="noopener noreferrer">1905电影网<svg class="icon"><use href="#icon-arrow"></use></svg></a>
        <a href="https://studio.blender.org/films/" target="_blank" rel="noopener noreferrer">Blender 开放电影<svg class="icon"><use href="#icon-arrow"></use></svg></a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-brand"><svg class="icon"><use href="#icon-film"></use></svg><strong>旧碟馆</strong></div>
    <p>封面与影片版权归原权利人所有。本站仅提供合法影片索引与跳转。</p>
    <a href="#top" class="back-to-top">回到顶部↑</a>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
